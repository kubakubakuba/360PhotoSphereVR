<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="dark">
	<title>360° Photo Sphere</title>
	<link rel="stylesheet" href="./lib/photo-sphere-viewer/index.css">
	<link rel="stylesheet" href="./style.css">
</head>
<body>
	<div id="panorama-viewer" class="stage"></div>
	<div id="viewer" class="stage" hidden></div>

	<header class="topbar">
		<div class="brand">
			<span id="app-title">360° Photo Sphere</span>
			<span id="photo-title" class="photo-title" hidden></span>
		</div>
		<div class="actions">
			<span id="vr-status" class="status-pill" data-state="pending" role="status">
				<span class="dot"></span>
				<span id="vr-status-text">Checking VR…</span>
			</span>
			<button id="open-gallery-btn" class="btn btn-ghost" type="button">
				<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
				<span class="label">Gallery</span>
			</button>
			<button id="enter-vr" class="btn btn-primary" type="button" disabled>
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h13A2.5 2.5 0 0 1 21 8.5v6a2.5 2.5 0 0 1-2.5 2.5h-3.2a2 2 0 0 1-1.7-1l-.9-1.5a.8.8 0 0 0-1.4 0l-.9 1.5a2 2 0 0 1-1.7 1H5.5A2.5 2.5 0 0 1 3 14.5z"/></svg>
				<span class="label">Enter VR</span>
			</button>
		</div>
	</header>

	<button id="prev-photo" class="nav-arrow nav-prev" type="button" aria-label="Previous photo" title="Previous photo (←)" hidden>
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
	</button>
	<button id="next-photo" class="nav-arrow nav-next" type="button" aria-label="Next photo" title="Next photo (→)" hidden>
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
	</button>

	<div id="vr-loading" class="loading" hidden>
		<div class="loading-text" id="loading-text">Starting VR…</div>
		<div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
	</div>

	<dialog id="gallery-modal" class="gallery-dialog" aria-labelledby="gallery-title">
		<div class="dialog-header">
			<h2 id="gallery-title">Gallery</h2>
			<button id="gallery-close" class="icon-btn" type="button" aria-label="Close gallery">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
			</button>
		</div>
		<div class="dialog-body">
			<section class="gallery-section">
				<h3 class="section-title">On this device</h3>
				<div id="local-grid" class="gallery-grid"></div>
			</section>
			<section class="gallery-section">
				<h3 class="section-title">Gallery</h3>
				<div id="gallery-grid" class="gallery-grid"></div>
			</section>
		</div>
	</dialog>

	<input id="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple hidden>

	<div id="drop-overlay" class="drop-overlay" hidden>
		<div class="drop-message">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
			<span>Drop 360° photos to view them</span>
		</div>
	</div>

	<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

	<script src="config.js"></script>
	<script type="importmap">
		{
			"imports": {
				"three": "./lib/three/three.module.js",
				"@photo-sphere-viewer/core": "./lib/photo-sphere-viewer/index.module.js"
			}
		}
	</script>
	<script type="module" src="app.js"></script>
</body>
</html>
