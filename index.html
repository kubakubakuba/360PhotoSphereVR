<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="dark">
	<title>360° Photo Sphere</title>
	<link rel="stylesheet" href="./lib/photo-sphere-viewer/index.css">
	<link rel="stylesheet" href="./style.css">
</head>
<body>
	<div id="panorama-viewer" class="stage"></div>
	<div id="viewer" class="stage" hidden></div>

	<header class="topbar">
		<div class="brand">
			<span id="app-title">360° Photo Sphere</span>
			<span id="photo-title" class="photo-title" hidden></span>
		</div>
		<div class="actions">
			<span id="vr-status" class="status-pill" data-state="pending" role="status">
				<span class="dot"></span>
				<span id="vr-status-text">Checking VR…</span>
			</span>
			<button id="copy-link-btn" class="btn btn-ghost btn-icon" type="button" title="Copy a link to this view" aria-label="Copy a link to this view">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L12 5.6"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4L12 18.4"/></svg>
			</button>
			<button id="toggle-hotspots-btn" class="btn btn-ghost btn-icon btn-toggle" type="button" aria-pressed="true" title="Markers to nearby photos (H)" aria-label="Markers to nearby photos" hidden>
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.7-6.5-11a6.5 6.5 0 0 1 13 0c0 5.3-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/><path class="toggle-off" d="M4 3l16 18"/></svg>
			</button>
			<button id="open-gallery-btn" class="btn btn-ghost" type="button">
				<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
				<span class="label">Gallery</span>
			</button>
			<button id="open-globe-btn" class="btn btn-ghost" type="button" hidden>
				<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.4 2.5 3.6 5.5 3.6 9s-1.2 6.5-3.6 9c-2.4-2.5-3.6-5.5-3.6-9S9.6 5.5 12 3z"/></svg>
				<span class="label">Map</span>
			</button>
			<button id="enter-vr" class="btn btn-primary" type="button" disabled>
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h13A2.5 2.5 0 0 1 21 8.5v6a2.5 2.5 0 0 1-2.5 2.5h-3.2a2 2 0 0 1-1.7-1l-.9-1.5a.8.8 0 0 0-1.4 0l-.9 1.5a2 2 0 0 1-1.7 1H5.5A2.5 2.5 0 0 1 3 14.5z"/></svg>
				<span class="label">Enter VR</span>
			</button>
		</div>
	</header>

	<button id="prev-photo" class="nav-arrow nav-prev" type="button" aria-label="Previous photo" title="Previous photo (←)" hidden>
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
	</button>
	<button id="next-photo" class="nav-arrow nav-next" type="button" aria-label="Next photo" title="Next photo (→)" hidden>
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
	</button>

	<div id="hd-progress" class="hd-progress" role="status" hidden></div>

	<div id="vr-loading" class="loading" hidden>
		<div class="loading-text" id="loading-text">Starting VR…</div>
		<div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
	</div>

	<dialog id="gallery-modal" class="gallery-dialog" aria-labelledby="gallery-title">
		<div class="dialog-header">
			<h2 id="gallery-title">Gallery</h2>
			<button id="gallery-close" class="icon-btn" type="button" aria-label="Close gallery">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
			</button>
		</div>
		<div class="dialog-body">
			<section class="gallery-section">
				<h3 class="section-title">On this device</h3>
				<div id="local-grid" class="gallery-grid"></div>
			</section>
			<section class="gallery-section">
				<h3 class="section-title">Gallery</h3>
				<div id="gallery-grid" class="gallery-grid"></div>
			</section>
		</div>
	</dialog>

	<dialog id="globe-modal" class="globe-dialog" aria-labelledby="globe-title">
		<div class="dialog-header">
			<h2 id="globe-title">Map</h2>
			<button id="globe-close" class="icon-btn" type="button" aria-label="Close map">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
			</button>
		</div>
		<div id="globe-stage" class="globe-stage">
			<div id="globe-card" class="globe-card" hidden>
				<h3 id="globe-card-title"></h3>
				<p id="globe-card-description"></p>
				<div class="globe-card-footer">
					<span id="globe-card-count"></span>
					<span id="globe-card-action" class="globe-card-action"></span>
				</div>
			</div>
			<div class="globe-zoom">
				<button id="globe-locate" class="icon-btn" type="button" aria-label="Go to the current photo" title="Go to the current photo">
					<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/><circle cx="12" cy="12" r="7.5"/></svg>
				</button>
				<button id="globe-zoom-in" class="icon-btn" type="button" aria-label="Zoom in">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
				</button>
				<button id="globe-zoom-out" class="icon-btn" type="button" aria-label="Zoom out">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
				</button>
			</div>
			<div id="globe-attribution" class="globe-attribution" hidden></div>
		</div>
	</dialog>

	<input id="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple hidden>

	<div id="drop-overlay" class="drop-overlay" hidden>
		<div class="drop-message">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
			<span>Drop 360° photos to view them</span>
		</div>
	</div>

	<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

	<script src="config.js"></script>
	<script type="importmap">
		{
			"imports": {
				"three": "./lib/three/three.module.js",
				"@photo-sphere-viewer/core": "./lib/photo-sphere-viewer/index.module.js"
			}
		}
	</script>
	<script type="module" src="app.js"></script>
</body>
</html>
